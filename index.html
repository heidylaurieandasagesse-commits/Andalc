
<script>
    function calculer() {
        let valeur1 = document.getElementById("nombre1").value;
        let valeur2 = document.getElementById("nombre2").value;
        let operation = document.getElementById("operation").value;

        if (valeur1 === "") {
            document.getElementById("resultat").textContent =
                "Entre le premier nombre !";
            return;
        }

        if (operation !== "racine" && valeur2 === "") {
            document.getElementById("resultat").textContent =
                "Entre le deuxième nombre !";
            return;
        }

        let nombre1 = Number(valeur1);
        let nombre2 = Number(valeur2);
        let resultat;

        if (operation === "+") {
            resultat = nombre1 + nombre2;

        } else if (operation === "-") {
            resultat = nombre1 - nombre2;

        } else if (operation === "*") {
            resultat = nombre1 * nombre2;

        } else if (operation === "/") {
            if (nombre2 === 0) {
                document.getElementById("resultat").textContent =
                    "Erreur : division par zéro !";
                return;
            }
            resultat = nombre1 / nombre2;

        } else if (operation === "puissance") {
            resultat = nombre1 ** nombre2;

        } else if (operation === "racine") {
            if (nombre1 < 0) {
                document.getElementById("resultat").textContent =
                    "Erreur : racine carrée d'un nombre négatif !";
                return;
            }
            resultat = Math.sqrt(nombre1);

        } else if (operation === "pourcentage") {
            resultat = (nombre1 / 100) * nombre2;
        }

        document.getElementById("resultat").textContent =
            "Résultat : " + resultat;
    }
</script>
